# Ripperdoc Clarity: a sharper image on a base M4 (16 GB), Cyberpunk 2077 2.5, capped at 60 fps.
# Measured with `ripperdoc bench` (built-in benchmark, frame cap off), docs/GRAPHICS.md has the numbers:
#   before: 63.5 fps average, 1%-low 40.4 (MetalFX Balanced, Medium textures, 8x filtering)
#   clarity: 56.7 fps average, 1%-low 38.4, no swapping
# Kept only what stays at or above 30 fps in the 1%-low without making macOS swap.

# Render at ~1440x810 instead of ~1270x720 before MetalFX upscales to 1080p: the biggest sharpness gain (-6 fps).
setting /graphics/presets ResolutionScaling MetalFX
setting /graphics/presets MetalFX Quality
setting /graphics/presets DynamicResolutionScaling false
# A crisper MetalFX result; free.
setting /graphics/presets MetalFX_Sharpness 0.7
# Sharper textures up close; about +1 GB of GPU memory, no FPS cost, no swapping in the benchmark.
setting /graphics/presets TextureQuality High
# Sharper ground and roads at an angle; free.
setting /graphics/advanced Anisotropy 16
# Rejected in the measurements (kept as they were):
#   2560x1440 output: 1%-low 26.7 (Quality) / 13.9 with swapping (Balanced)
#   LOD Medium: 1%-low 29.9 and 366 MB of swapping
setting /graphics/advanced LODPreset Low
setting /video/display Resolution 1920x1080
# Capped at 60: it runs at ~57 on average. For perfectly even pacing in heavy scenes, cap at 30 (the 1%-low, 38, never
# drops below it): ripperdoc graphics set /video/display MaximumFPS_Value 30
setting /video/display MaximumFPS_OnOff true
setting /video/display MaximumFPS_Value 60
